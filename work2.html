<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme 3D Parallax</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #080808;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .scroll-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60vh 0;
            perspective: 2000px;
        }

        .card-wrapper {
            position: relative;
            margin-bottom: 20vh;
            perspective: 2000px;
        }

        .card {
            position: relative;
            width: 80vw;
            max-width: 900px;
            height: 500px;
            border-radius: 40px;
            background: #111;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            
            /* Твоя CSS анимация скролла */
            view-timeline-name: --card-scroll;
            view-timeline-axis: block;
            animation: super-3d both linear;
            animation-timeline: --card-scroll;
            animation-range: entry 0% exit 100%;
            
            transform-style: preserve-3d;
            /* Плавный переход для JS-трансформаций */
            transition: transform 0.15s cubic-bezier(0.33, 1, 0.68, 1);
        }

        /* Усиленный блик */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255,255,255,0.2) 0%, 
                transparent 50%
            );
            z-index: 5;
            pointer-events: none;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            pointer-events: none;
            /* Включаем 3D для вложенных элементов */
            transform-style: preserve-3d;
            /* Плавный параллакс текста */
            transition: transform 0.2s ease-out;
        }

        .card-content h2 {
            font-size: clamp(2rem, 8vw, 6rem);
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Выносим текст сильно вперед по оси Z */
            transform: translateZ(150px);
            will-change: transform;
        }

        @keyframes super-3d {
            0% { opacity: 0; transform: rotateX(-60deg) rotateY(-10deg) scale(0.6) translateZ(-500px); filter: blur(15px); }
            50% { opacity: 1; transform: rotateX(0deg) rotateY(0deg) scale(1) translateZ(0); filter: blur(0px); }
            100% { opacity: 0; transform: rotateX(60deg) rotateY(10deg) scale(0.6) translateZ(-500px); filter: blur(15px); }
        }

        .bg-gradient {
            position: absolute;
            inset: -10%; /* Запас для движения фона */
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, #222 0%, #050505 100%);
            z-index: -1;
            transition: transform 0.2s ease-out;
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="card-wrapper">
            <div class="card">
                <div class="bg-gradient"></div>
                <div class="card-content"><h2>Visual<br>Design</h2></div>
            </div>
        </div>

        <div class="card-wrapper">
            <div class="card">
                <div class="bg-gradient" style="background: radial-gradient(circle, #2a1a1a 0%, #050505 100%);"></div>
                <div class="card-content"><h2>Motion</h2></div>
            </div>
        </div>

        <div class="card-wrapper">
            <div class="card">
                <div class="bg-gradient" style="background: radial-gradient(circle, #1a2a1a 0%, #050505 100%);"></div>
                <div class="card-content"><h2>Future</h2></div>
            </div>
        </div>
    </div>

    <script>
        const wrappers = document.querySelectorAll('.card-wrapper');

        wrappers.forEach(wrapper => {
            const card = wrapper.querySelector('.card');
            const content = wrapper.querySelector('.card-content');
            const bg = wrapper.querySelector('.bg-gradient');
            const title = wrapper.querySelector('h2');

            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;

                // 1. УСИЛЕННЫЙ НАКЛОН КАРТОЧКИ (до 30 градусов)
                card.style.transform = `rotateX(${(y * -30).toFixed(2)}deg) rotateY(${(x * 30).toFixed(2)}deg) scale(1.05)`;

                // 2. ДВИЖЕНИЕ ТЕКСТА (Параллакс внутри 3D)
                // Текст смещается в сторону мыши, создавая эффект объема
                const tx = (x * 40).toFixed(1);
                const ty = (y * 40).toFixed(1);
                content.style.transform = `translateX(${tx}px) translateY(${ty}px) translateZ(150px)`;

                // 3. ТЕНЬ ТЕКСТА (в противоположную сторону)
                const sx = (x * -20).toFixed(1);
                const sy = (y * -20).toFixed(1);
                title.style.textShadow = `${sx}px ${sy}px 20px rgba(255,255,255,0.3), 0 0 40px rgba(0,0,0,0.5)`;

                // 4. ДВИЖЕНИЕ ФОНА (в противоположную сторону от наклона)
                bg.style.transform = `translateX(${(x * -20).toFixed(1)}px) translateY(${(y * -20).toFixed(1)}px)`;

                // 5. КООРДИНАТЫ БЛИКА
                card.style.setProperty('--mouse-x', `${((e.clientX - rect.left) / rect.width * 100).toFixed(1)}%`);
                card.style.setProperty('--mouse-y', `${((e.clientY - rect.top) / rect.height * 100).toFixed(1)}%`);
            });

            wrapper.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
                content.style.transform = `translateX(0) translateY(0) translateZ(150px)`;
                bg.style.transform = `translateX(0) translateY(0)`;
                title.style.textShadow = 'none';
            });
        });
    </script>
</body>
</html>
